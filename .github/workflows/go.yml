name: Go Cross-Platform CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.25', '1.26']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Get dependencies
      run: go mod download

    - name: Vet code
      run: go vet ./...

    - name: Run unit tests
      run: go test -v -race ./...

    - name: Build binary
      run: go build -v ./cmd/aegis

    - name: Check Unix installer syntax
      shell: bash
      run: |
        bash -n install.sh
        bash -n scripts/configure-path.sh

    - name: Check Windows installer syntax
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $parseErrors = $null
        $tokens = $null
        [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'install.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
        if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
